# Tab推荐流用的倒排索引
# 物料库文档：http://wiki.intra.sina.com.cn/pages/viewpage.action?pageId=263098020
#   非关注类优质库
#
# https://stackoverflow.com/questions/335695/lists-in-configparser
[Basic]
Active = True
CacheFile = tab.pgc.cache
# 不能是 "a", 解析会变成 '"a"'，string多一层引号
CacheMode = a

[Scan]
# table name is get redis by key
Host = rm54728.eos.grid.sina.com.cn
Port = 54728
DB = 0
Table = pgc_operation

[Load]
SourceName = aliyun
ProcessNumber = 10
# 特征依次为：10650(oid) 10570(时长) 1082(feed uid，7天有效期) 100307(新做uid, 基础物料库入库，270天) 10566(是否竖版), 10988(新gid)
# "10482", "10483", "10484" 人工标签  "10419", "10420", "10421" 机打标签  "10588", "10589", "10590" 投稿原始ID
# 10748(投稿c1) 10749(投稿c2) 10750(投稿c3) 投稿标签-统一标签id(暂时给 标签实时反馈使用，3.29 下线)
# "10588", "10589", "10590" 投稿原始ID
# 10776(7天曝光) 10777(7天点击) 10698(24h曝光) 10700(24h点击)
StaticFids = ["1082", "100307", "10988", "10419", "10420", "10421", "10482", "10483", "10484"]
DynamicFids = ["10776", "10777", "10698", "10700"]

OtherLoaderList = [["NoioLoader", {}]]

[Filter]
# 使用运营投递时自带的 "aid"过滤：如果投递时，没有aid字段
BasicFilterList = [["uid_filter", "NoneFilter", {"fid":"aid"}]]

[Rank]
DefaultRanker = ["TabRanker", {}]

# PGC运营投递物料，一级和二级标签建立物料倒排
# 线上总控匹配，采用热门实时画像(分数截断L1 sc>=0.2, L2 sc>=0.1 ）
# 21177 热门微博热门流一级短期兴趣小时级(增量)-新体系 L1
# 21178 热门微博热门流二级短期兴趣小时级(增量)-新体系 L2
# 21179 热门微博热门流三级短期兴趣小时级(增量)-新体系 L3
# score is begin ts
# key=newtab_operation_tag2mids_v1,
# value=[{tag_id: [{"mid": mid， "aid":aid, "score": score, "gid": gid,
#                   "begin": begin, "expired": expired, "text": text,
#                   "data_type": data_type, "is_all": is_all, "source": source, "tg_ty": tg_ty}]},
#        {“is_all_1”:  [{"mid": mid， "aid":aid, "score": score, "gid": gid,
#                   "begin": begin, "expired": expired, "text": text,
#                   "data_type": data_type, "is_all": is_all, "source": source, "tg_ty": tg_ty}]}
#       ]
#
[Factory_1]
class = TabTagPgcFactory
prefix = newtab_operation_tag2mids_
version = v1
num = 1000
redis_addr = ["rm20605.eos.grid.sina.com.cn", 20605, 0, false]


