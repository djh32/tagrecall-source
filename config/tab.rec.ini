# Tab推荐流用的倒排索引
# 物料库文档：http://wiki.intra.sina.com.cn/pages/viewpage.action?pageId=263098020
#   非关注类优质库
#
# https://stackoverflow.com/questions/335695/lists-in-configparser
[Basic]
Active = True
CacheFile = tab.rec.cache

[Scan]
Host = m9747i.eos.grid.sina.com.cn
Port = 9747
DB = db_video
Table = video_material_recom_online

[Load]
SourceName = aliyun
ProcessNumber = 10
# 特征依次为：10539(old gid 已经下线) 10650(oid) 10570(时长) 1082(feed uid，7天有效期) 100307(新做uid, 基础物料库入库，270天) 10566(是否竖版), 10988(新gid)
# "10482", "10483", "10484" 人工标签  "10419", "10420", "10421" 机打标签  "10588", "10589", "10590" 投稿原始ID
# 10748(投稿c1) 10749(投稿c2) 10750(投稿c3) 投稿标签-统一标签id(暂时给 标签实时反馈使用，3.29 下线)
# "10588", "10589", "10590" 投稿原始ID
# 10776(7天曝光) 10777(7天点击) 10698(24h曝光) 10700(24h点击)
StaticFids = ["10650", "10570", "1082", "100307", "10566", "10988", "10419", "10420", "10421", "10482", "10483", "10484", "10588", "10589", "10590"]
DynamicFids = ["10776", "10777", "10698", "10700"]

OtherLoaderList = [["NoioLoader", {}]]

[Filter]
BasicFilterList = [["uid_filter", "NoneFilter", {"fid":"100307"}]]

[Rank]
DefaultRanker = ["TabRanker", {}]

# 标签倒排（热度序）。
[Factory_1]
class = TabTagFactory
prefix = newtab_tag_
version = v1
num = 300
redis_addr = ["rm51826.eos.grid.sina.com.cn", 51826, 0, false]

# 作者倒排（热度序）。
[Factory_2]
class = TabUserFactory
prefix = newtab_uid_
version = v1
num = 300
redis_addr = ["rm51826.eos.grid.sina.com.cn", 51826, 0, false]

# 作者倒排（时间序）。
[Factory_3]
class = TabUser2Factory
prefix = newtab_uid2_
version = v2
num = 300
redis_addr = ["rm51826.eos.grid.sina.com.cn", 51826, 0, false]

# 接口保障的任务，给平台同步数据，用的这个教育分类的倒排，由于  "10588", "10589", "10590" 特征下线，服务保障换成大数据标签对应的factory
[Factory_4]
class = TabTagSid2Factory
prefix = tab_sid_
version = v3
num = 300
redis_addr = ["rm51826.eos.grid.sina.com.cn", 51826, 10, false]

# HS降级物料：key=newtab_tag2mids_v1, value=[{tag_id: [{"mid": mid， "aid":aid, "score": score, "gid": gid}]}], l1 57个，num=100
[Factory_5]
class = SingleKeyFactory
prefix = newtab_tag2mids_
version = v1
num = 100
redis_addr = ["rm20605.eos.grid.sina.com.cn", 20605, 0, false]


