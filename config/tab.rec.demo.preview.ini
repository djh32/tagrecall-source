# Tab推荐流 Demo 页面倒排索引 —— dry-run 预览配置
# 与 tab.rec.demo.ini 完全一致，区别：
#   1. Factory 加了 dry_run = True（只生成、不写 redis、不写监控）
#   2. CacheFile 独立为 tab.rec.demo.preview.cache，避免与线上 demo 缓存互相覆盖
# 运行方式：python tagrecall/scripts/run_default_worker.py tab.rec.demo.preview.ini
# 用途：验证 demo 切换新物料库后的耗时变化（对比 tab.rec.demo.ini 正式运行）
#
# 物料库文档：http://wiki.intra.sina.com.cn/pages/viewpage.action?pageId=263098020
#   非关注类优质库
#
# https://stackoverflow.com/questions/335695/lists-in-configparser
[Basic]
Active = True
CacheFile = tab.rec.demo.preview.cache

[Scan]
# 扫描打点物料库规则的KOL物料，KOL数量更多，曝光过滤为3个流
# 社区kolmysql：video_material_recom_tab_collect
# 打点kolmysql：video_material_recom_hitpoint_collect
# 已切换到新架构物料库（旧库 db_video.video_material_recom_online 已停更）
Host = m9747i.eos.grid.sina.com.cn
Port = 9747
DB = material_new_arch
Table = dot_material_online

[Load]
SourceName = aliyun
ProcessNumber = 10
# 特征依次为：10539(old gid 已经下线) 10650(oid) 10570(时长) 1082(feed uid，7天有效期) 100307(新做uid, 基础物料库入库，270天) 10566(是否竖版), 10988(新gid)
# "10482", "10483", "10484" 人工标签  "10419", "10420", "10421" 机打标签  "10588", "10589", "10590" 投稿原始ID
# 10748(投稿c1) 10749(投稿c2) 10750(投稿c3) 投稿标签-统一标签id(暂时给 标签实时反馈使用，3.29 下线)
# 10776(7天曝光) 10777(7天点击) 10698(24h曝光) 10700(24h点击)
# "10824",  //Tab男性的真实点击数_离线更新7天内数据
# "10825",  //Tab男性的真实曝光数_离线更新7天内数据
# "10831",  //Tab女性的真实点击数_离线更新7天内数据
# "10832",  //Tab女性的真实曝光数_离线更新7天内数据
StaticFids = [ "10650", "10570", "1082", "100307", "10566", "10988", "10419", "10420", "10421", "10482", "10483", "10484", "10588", "10589", "10590"]
DynamicFids = ["10776", "10777", "10698", "10700", "10824", "10825", "10831", "10832"]

OtherLoaderList = [["NoioLoader", {}]]

[Filter]
BasicFilterList = [["uid_filter", "NoneFilter", {"fid":"100307"}]]

[Rank]
DefaultRanker = ["TabRanker", {}]

# HS降级物料：key=newtab_tag2mids_v1, value=[{tag_id: [{"mid": mid, "score": score, "gid": gid}]}], l1 57个，num=100
[Factory_1]
class = TabGlobalCtrFactory
prefix = tab_mids_
version = v1
num = 300
dry_run = True
redis_addr = ["rm51826.eos.grid.sina.com.cn", 51826, 0, false]
